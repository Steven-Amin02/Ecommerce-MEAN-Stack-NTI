name: ShopWave CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # 1. BACKEND CI: Install Dependencies & Validate Server Code
  # -------------------------------------------------------------
  backend-ci:
    name: Backend CI (Node.js & Express)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Backend Dependencies
        run: |
          npm ci

      - name: Validate Backend Code Syntax
        run: |
          node -c src/server.js

  # -------------------------------------------------------------
  # 2. FRONTEND CI: Build & Test Angular Single Page Application
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Angular 22 Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Build Angular Application (Production)
        working-directory: ./frontend
        run: |
          npx ng build --configuration production

      - name: Upload Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-production-build
          path: frontend/dist/frontend
          retention-days: 7

  # -------------------------------------------------------------
  # 3. DEPLOYMENT STAGE: Ready for Deployment trigger
  # -------------------------------------------------------------
  deploy-status:
    name: Deployment Readiness Check
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Log Deployment Success Status
        run: |
          echo "✅ ShopWave CI/CD Pipeline passed successfully!"
          echo "🚀 Artifacts built and ready for deployment to Vercel/Netlify/Heroku/Render."
